name: Daily NPR digest

on:
  schedule:
    # Three runs a day (UTC) so Morning Edition / ATC segments are caught before
    # they scroll off their 10-item feeds. ~10am, 3pm, 8pm US Eastern (standard time).
    - cron: "7 1,15,20 * * *"
  workflow_dispatch: {}   # "Run workflow" button — works from the GitHub mobile app

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Check out the branch tip, not the SHA the run was queued at: a run that
      # waited behind another one (concurrency group) must see its data commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch feeds
        run: python scripts/fetch_feeds.py --transcripts

      - name: Summarize and tag new segments
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/summarize.py

      - name: Build page
        run: python scripts/build_page.py

      - name: Commit data store
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data/segments.json
          git diff --cached --quiet || git commit -m "Update digest data"
          # The owner may have pushed (e.g. edited feeds.json from the phone)
          # while this ran; rebase onto it rather than failing the deploy.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin "${{ github.ref_name }}"
          done
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
